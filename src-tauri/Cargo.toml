[package]
name = "qastor"
version = "0.1.0"
description = "Desktop app for executing manual E2E test cases with screenshot evidence"
authors = ["Adrián Domínguez Casasola"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "qastor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
log = "0.4"
tauri = { version = "2.11.0", features = [] }
tauri-plugin-log = "2"
