[package]
name = "qastor"
version = "0.1.0"
description = "Desktop app for executing manual E2E test cases with screenshot evidence"
authors = ["Adrián Domínguez Casasola"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "qastor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.23", features = ["v4", "serde"] }
walkdir = "2.5"
notify = "8.2"
tauri = { version = "2.11.0", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-store = "2.4"
tauri-plugin-dialog = "2.7"
tauri-plugin-fs = "2.5"
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2.3"
infer = "0.19"
anyhow = "1"
